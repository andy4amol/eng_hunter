name: Android TV CI & APK Build

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    name: Build EngHunter TV APK & Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle with caching
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run JVM Unit Tests (Digital Twin Simulator + Anti-Vocal-Cancel + Scorer)
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Assemble Debug APK for Xiaomi TV & XMKGMKF01YM
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Unit Test HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enghunter-tv-unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 14

      - name: Upload Xiaomi TV Installable APK
        uses: actions/upload-artifact@v4
        with:
          name: enghunter-tv-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
